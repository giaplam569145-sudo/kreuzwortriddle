[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".mypy_cache/", ".ruff_cache/", ".pytest_cache/", "__pycache__/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["\\.mypy_cache/", "\\.ruff_cache/", "\\.pytest_cache/", "__pycache__/"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_framework.py"]
