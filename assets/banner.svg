<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>

    <linearGradient id="cellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="activeCellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="highlightCellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glowOrange" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#gridPattern)"/>

  <!-- Decorative Ambient Glows -->
  <circle cx="220" cy="200" r="180" fill="#0284C7" opacity="0.12" filter="url(#glowBlue)"/>
  <circle cx="360" cy="140" r="120" fill="#F97316" opacity="0.1" filter="url(#glowOrange)"/>
  <circle cx="1050" cy="80" r="150" fill="#818CF8" opacity="0.08" filter="url(#glowBlue)"/>

  <!-- Left Side Graphic: Stylized Crossword Grid -->
  <g transform="translate(60, 50)">
    <!-- Grid Frame Background -->
    <rect x="0" y="0" width="380" height="300" rx="16" fill="#0F172A" stroke="#334155" stroke-width="2" opacity="0.8"/>

    <!-- Crossword Cells Matrix (6x5 Grid of 50px cells + 8px gap) -->
    <!-- Row 0 -->
    <rect x="24" y="24" width="50" height="50" rx="8" fill="url(#cellGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="82" y="24" width="50" height="50" rx="8" fill="url(#cellGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <!-- 'C' -->
    <rect x="140" y="24" width="50" height="50" rx="8" fill="url(#activeCellGrad)" stroke="#38BDF8" stroke-width="2"/>
    <text x="165" y="58" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" text-anchor="middle">C</text>
    <text x="146" y="38" font-family="system-ui, sans-serif" font-size="10" fill="#BAE6FD">1</text>

    <rect x="198" y="24" width="50" height="50" rx="8" fill="url(#cellGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="256" y="24" width="50" height="50" rx="8" fill="url(#cellGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="314" y="24" width="50" height="50" rx="8" fill="url(#cellGrad)" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Row 1 -->
    <rect x="24" y="82" width="50" height="50" rx="8" fill="url(#cellGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <!-- 'L' -->
    <rect x="82" y="82" width="50" height="50" rx="8" fill="url(#activeCellGrad)" stroke="#38BDF8" stroke-width="2"/>
    <text x="107" y="116" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" text-anchor="middle">L</text>

    <!-- 'R' -->
    <rect x="140" y="82" width="50" height="50" rx="8" fill="url(#activeCellGrad)" stroke="#38BDF8" stroke-width="2"/>
    <text x="165" y="116" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" text-anchor="middle">R</text>

    <!-- 'O' -->
    <rect x="198" y="82" width="50" height="50" rx="8" fill="url(#activeCellGrad)" stroke="#38BDF8" stroke-width="2"/>
    <text x="223" y="116" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" text-anchor="middle">O</text>

    <!-- 'S' -->
    <rect x="256" y="82" width="50" height="50" rx="8" fill="url(#activeCellGrad)" stroke="#38BDF8" stroke-width="2"/>
    <text x="281" y="116" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" text-anchor="middle">S</text>

    <!-- 'S' -->
    <rect x="314" y="82" width="50" height="50" rx="8" fill="url(#activeCellGrad)" stroke="#38BDF8" stroke-width="2"/>
    <text x="339" y="116" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" text-anchor="middle">S</text>
    <text x="320" y="96" font-family="system-ui, sans-serif" font-size="10" fill="#BAE6FD">2</text>

    <!-- Row 2 -->
    <!-- 'L' -->
    <rect x="24" y="140" width="50" height="50" rx="8" fill="url(#activeCellGrad)" stroke="#38BDF8" stroke-width="2"/>
    <text x="49" y="174" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" text-anchor="middle">L</text>
    <text x="30" y="154" font-family="system-ui, sans-serif" font-size="10" fill="#BAE6FD">3</text>

    <!-- 'M' -->
    <rect x="82" y="140" width="50" height="50" rx="8" fill="url(#highlightCellGrad)" stroke="#FF6B35" stroke-width="2.5" filter="url(#glowOrange)"/>
    <text x="107" y="174" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" text-anchor="middle">M</text>

    <!-- 'O' -->
    <rect x="140" y="140" width="50" height="50" rx="8" fill="url(#activeCellGrad)" stroke="#38BDF8" stroke-width="2"/>
    <text x="165" y="174" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" text-anchor="middle">O</text>

    <rect x="198" y="140" width="50" height="50" rx="8" fill="url(#cellGrad)" stroke="#1E293B" stroke-width="1.5"/>

    <!-- 'P' -->
    <rect x="256" y="140" width="50" height="50" rx="8" fill="url(#activeCellGrad)" stroke="#38BDF8" stroke-width="2"/>
    <text x="281" y="174" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" text-anchor="middle">P</text>

    <!-- 'W' -->
    <rect x="314" y="140" width="50" height="50" rx="8" fill="url(#activeCellGrad)" stroke="#38BDF8" stroke-width="2"/>
    <text x="339" y="174" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" text-anchor="middle">W</text>

    <!-- Row 3 -->
    <!-- 'M' -->
    <rect x="24" y="198" width="50" height="50" rx="8" fill="url(#activeCellGrad)" stroke="#38BDF8" stroke-width="2"/>
    <text x="49" y="232" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" text-anchor="middle">M</text>

    <rect x="82" y="198" width="50" height="50" rx="8" fill="url(#cellGrad)" stroke="#1E293B" stroke-width="1.5"/>

    <!-- 'S' -->
    <rect x="140" y="198" width="50" height="50" rx="8" fill="url(#activeCellGrad)" stroke="#38BDF8" stroke-width="2"/>
    <text x="165" y="232" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" text-anchor="middle">S</text>

    <rect x="198" y="198" width="50" height="50" rx="8" fill="url(#cellGrad)" stroke="#1E293B" stroke-width="1.5"/>

    <!-- 'I' -->
    <rect x="256" y="198" width="50" height="50" rx="8" fill="url(#activeCellGrad)" stroke="#38BDF8" stroke-width="2"/>
    <text x="281" y="232" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" text-anchor="middle">I</text>

    <!-- 'O' -->
    <rect x="314" y="198" width="50" height="50" rx="8" fill="url(#activeCellGrad)" stroke="#38BDF8" stroke-width="2"/>
    <text x="339" y="232" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" text-anchor="middle">O</text>

    <!-- Row 4 -->
    <rect x="24" y="256" width="50" height="50" rx="8" fill="url(#cellGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="82" y="256" width="50" height="50" rx="8" fill="url(#cellGrad)" stroke="#1E293B" stroke-width="1.5"/>

    <!-- 'S' -->
    <rect x="140" y="256" width="50" height="50" rx="8" fill="url(#highlightCellGrad)" stroke="#FF6B35" stroke-width="2.5" filter="url(#glowOrange)"/>
    <text x="165" y="290" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" text-anchor="middle">S</text>

    <rect x="198" y="256" width="50" height="50" rx="8" fill="url(#cellGrad)" stroke="#1E293B" stroke-width="1.5"/>

    <!-- 'D' -->
    <rect x="256" y="256" width="50" height="50" rx="8" fill="url(#activeCellGrad)" stroke="#38BDF8" stroke-width="2"/>
    <text x="281" y="290" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" text-anchor="middle">D</text>

    <!-- 'R' -->
    <rect x="314" y="256" width="50" height="50" rx="8" fill="url(#activeCellGrad)" stroke="#38BDF8" stroke-width="2"/>
    <text x="339" y="290" font-family="system-ui, sans-serif" font-weight="800" font-size="26" fill="#FFFFFF" text-anchor="middle">R</text>

    <!-- Intersection Connection Nodes -->
    <circle cx="107" cy="165" r="5" fill="#FF6B35"/>
    <circle cx="165" cy="281" r="5" fill="#FF6B35"/>
  </g>

  <!-- Divider Line -->
  <line x1="480" y1="60" x2="480" y2="340" stroke="#334155" stroke-width="1" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Right Side Content -->
  <g transform="translate(520, 65)">

    <!-- Top Badge -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <circle cx="14" cy="14" r="5" fill="#38BDF8"/>
    <text x="28" y="18" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#38BDF8" letter-spacing="1">PYTHON FRAMEWORK</text>

    <!-- Main Title -->
    <text x="0" y="72" font-family="system-ui, sans-serif" font-weight="900" font-size="44" fill="url(#titleGrad)" letter-spacing="-0.5">
      Crossword Riddle
    </text>

    <!-- Subtitle -->
    <text x="0" y="104" font-family="system-ui, sans-serif" font-weight="500" font-size="20" fill="#94A3B8">
      Automatische Kreuzworträtsel-Generierung für LLMs
    </text>

    <text x="0" y="128" font-family="system-ui, sans-serif" font-size="14" fill="#64748B">
      Backtracking Engine • Multidirektionale Schnittpunkte • GameModes • MCP &amp; REST API
    </text>

    <!-- Feature Pills Grid -->
    <g transform="translate(0, 152)">
      <!-- Pill 1: Backtracking -->
      <rect x="0" y="0" width="165" height="32" rx="8" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
      <text x="12" y="20" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#7DD3FC">⚡ Backtracking Engine</text>

      <!-- Pill 2: Bonus System -->
      <rect x="175" y="0" width="165" height="32" rx="8" fill="#0F172A" stroke="#EA580C" stroke-width="1"/>
      <text x="187" y="20" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#FDBA74">🎁 Bonuswort-System</text>

      <!-- Pill 3: Game Modes -->
      <rect x="350" y="0" width="165" height="32" rx="8" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
      <text x="362" y="20" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#C7D2FE">🎮 Erweiterbare Modi</text>

      <!-- Pill 4: REST API -->
      <rect x="0" y="42" width="165" height="32" rx="8" fill="#0F172A" stroke="#0D9488" stroke-width="1"/>
      <text x="12" y="62" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#5EEAD4">🌐 Flask REST API</text>

      <!-- Pill 5: MCP Server -->
      <rect x="175" y="42" width="165" height="32" rx="8" fill="#0F172A" stroke="#C084FC" stroke-width="1"/>
      <text x="187" y="62" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#E9D5FF">🤖 MCP Server Tools</text>

      <!-- Pill 6: Zero Dependencies -->
      <rect x="350" y="42" width="165" height="32" rx="8" fill="#0F172A" stroke="#16A34A" stroke-width="1"/>
      <text x="362" y="62" font-family="system-ui, sans-serif" font-weight="600" font-size="12" fill="#86EFAC">📦 Zero-Dep Core</text>
    </g>

    <!-- Bottom Highlights Bar -->
    <g transform="translate(0, 248)">
      <line x1="0" y1="0" x2="620" y2="0" stroke="#334155" stroke-width="1" opacity="0.5"/>

      <text x="0" y="20" font-family="system-ui, sans-serif" font-size="13" fill="#94A3B8">
        <tspan fill="#38BDF8">✓ 49 Unit Tests</tspan> • <tspan fill="#F97316">✓ Type-Safe (mypy)</tspan> • <tspan fill="#A855F7">✓ Lint-Clean (ruff)</tspan> • <tspan fill="#22C55E">✓ MIT License</tspan>
      </text>
    </g>

  </g>
</svg>
